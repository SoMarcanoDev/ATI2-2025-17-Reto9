version: '3.8'
services:
  eureka-server:
    image: eureka #nombre de la imagen que hemos creado
    restart: always
    container_name: eureka
    ports:
    - '8761:8761'
    networks:
    - 'dockernetflix-network'
  spring-cloud-gateway-service:
    image: spring-cloud-gateway #nombre de la imagen que hemos creado
    restart: always
    container_name: spring-cloud-gateway
    ports:
    - '7000:7000'
    networks:
    - 'dockernetflix-network'
  greeting-microservice:
    image: greetmicroservice #nombre de la imagen que hemos creado
    restart: always
    container_name: greetmicroservice
    networks:
    - 'dockernetflix-network'
networks:
  dockernetflix-network: #necesitamos crear en una red para alojar los servicios en ella y que pued
