spring:
  application:
    name: greeting-microservice

#Tomcat Embedded Server Configuration
server:
  port: 8001

#Eureka Configuration Properties
eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    # ?? CRITICAL FIX: Use the Docker service name as the hostname for registration
    hostname: greeting-microservice
    # Optional: ensure it registers with the port it's running on
    instance-id: ${spring.application.name}:${server.port}