server:
  port: 7000
spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
    routes:
      - id: greet-path
        uri: lb://GREETING-MICROSERVICE
        predicates:
#          - Path=/greet/**
          - Path=/greeting-service/**
        filters:
          - StripPrefix=1
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    prefer-ip-address: true